name: Hardware-free pytest

on:
  pull_request:
  push:
    branches:
      - v1.2.1-dev

permissions:
  contents: read

jobs:
  hardware-free:
    name: Hardware-free pytest gate (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    env:
      PYTHONUTF8: "1"
    defaults:
      run:
        working-directory: src
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install base package and test tooling
        run: python -m pip install '.[dev]'
      - name: Base import smoke
        run: python -c "from core.run_outcome import RunOutcome; from core.compat import SLOTS_KWARG"
      - name: Run hardware-free suite
        run: python -m pytest tests -q -m 'not opencode and not docker and not slow'
