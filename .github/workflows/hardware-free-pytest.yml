name: Hardware-free pytest

on: pull_request

permissions:
  contents: read

jobs:
  hardware-free:
    name: Hardware-free pytest gate (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    env:
      PYTHONUTF8: "1"
    defaults:
      run:
        working-directory: src
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Prepare evidence directory
        run: mkdir -p ../../.omo/evidence
      - name: Install dev extras
        run: python -m pip install '.[dev]'
      - name: Run hardware-free suite
        run: python -m pytest tests -q -m 'not opencode and not docker and not slow' --junitxml=../../.omo/evidence/task-26-seam-runtime-continuation-trace.xml
      - name: Upload failed-test evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: hardware-free-pytest-junit-${{ matrix.python-version }}
          path: ../.omo/evidence/task-26-seam-runtime-continuation-trace.xml
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7
