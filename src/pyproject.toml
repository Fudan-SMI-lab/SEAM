[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sm-adapt"
version = "2.0.0"
requires-python = ">=3.10"
dependencies = [
    "jsonschema>=4.18,<5",
    "typing_extensions>=4.12,<5",
]

[project.optional-dependencies]
sqlite = [
    "pysqlite3-binary>=0.5,<1",
]
dev = [
    "pytest>=7.4,<9",
    "PyYAML>=6.0,<7",
    "pydantic>=2.8,<3",
    "rich>=13.0",
    "textual>=0.50",
    "tomli>=2.0,<3; python_version < '3.11'",
]
dashboard = [
    "rich>=13.0",
    "textual>=0.50",
]

[project.scripts]
seam = "scripts.sm_adapt_cli:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
workflows = ["*.yaml"]
prompts = ["*.md"]
config = ["*.yaml"]
schemas = ["*.json"]
test_project_template = ["*.py", "*.md", "*.txt"]

[tool.setuptools.packages.find]
where = ["."]
include = [
    "core*",
    "harness*",
    "migrator*",
    "rule_strategies*",
    "scripts*",
    "validators*",
    "workflows*",
    "prompts*",
    "config*",
    "schemas*",
    "test_project_template*",
    "tests*",
]

[tool.basedpyright]
extraPaths = ["_stubs"]

[tool.pytest.ini_options]
addopts = "--strict-markers"
markers = [
    "integration: crosses process, filesystem, or component boundaries; remains hardware-free unless combined with another marker",
    "opencode: requires a live OpenCode service and usable model credentials",
    "docker: requires a local Docker-compatible daemon and a pre-existing generic CPU image",
    "slow: may provision an alternate runtime or exceed the mandatory gate's runtime budget",
    "e2e: exercises a public SEAM workflow end to end and does not imply external hardware",
]
