name: npu_kernelbench_custom_op
version: "1.0"
description: "Single KernelBench operator generation, evaluation, and Ascend C repair workflow"

target_platform:
  preset: npu_ascend

globals:
  max_repair_iterations: 8  # 从 5 提到 8，应对 qwen3.8-27b 的慢修复
  stagnation_threshold: 3
  review_gate_enabled: false

agents:
  main_engineer:
    role: "main_engineer"
    lifecycle: "persistent"
  error_analyzer:
    role: "error_analyzer"
    lifecycle: "persistent"
  operator_fixer:
    role: "operator_fixer"
    lifecycle: "persistent"
  operator_environment_fixer:
    role: "operator_environment_fixer"
    lifecycle: "persistent"

terminals:
  complete: "Operator workflow complete"
  failed: "Operator workflow failed"
  blocked: "Operator task blocked"

phases:
  - id: phase_0_operator_env_detect
    name: operator_environment_detection
    type: builtin
    operation: "operator_task_validate"
    validator: operator_env_detect
    input_mapping:
      operator_task_dir: "${context.OPERATOR_TASK_DIR}"
      solution_type: "${context.SOLUTION_TYPE}"
      operator_level: "${context.OPERATOR_LEVEL}"
    transitions:
      on_success: phase_1_operator_runtime_detect
      on_failure: blocked

  - id: phase_1_operator_runtime_detect
    name: operator_runtime_detection
    type: builtin
    operation: "operator_runtime_detect"
    validator: operator_runtime_detect
    input_mapping:
      operator_task_dir: "${state.phase_0_operator_env_detect.operator_task_dir}"
      kernelbench_root: "${context.KERNELBENCH_ROOT}"
      target_soc: "${context.TARGET_SOC}"
      operator_level: "${state.phase_0_operator_env_detect.level}"
    transitions:
      on_success: phase_1_5_operator_runtime_configure
      on_failure: phase_1_5_operator_runtime_configure

  - id: phase_1_5_operator_runtime_configure
    name: operator_runtime_configuration
    type: builtin
    operation: "operator_runtime_configure"
    input_mapping:
      operator_task_dir: "${state.phase_0_operator_env_detect.operator_task_dir}"
      kernelbench_root: "${context.KERNELBENCH_ROOT}"
      target_soc: "${context.TARGET_SOC}"
      runtime_report: "${state.phase_1_operator_runtime_detect}"
    transitions:
      on_success: phase_2_operator_analysis
      on_failure: blocked

  - id: phase_2_operator_analysis
    name: operator_analysis
    type: llm
    agent: main_engineer
    prompt_template: "phase_2_operator_analysis"
    validator: operator_analysis
    runtime_skills:
      include:
        - cuda-custom-op-to-npu-custom-op
      inject_full: false
      missing: error
    input_mapping:
      operator_task_dir: "${state.phase_0_operator_env_detect.operator_task_dir}"
      operator_name: "${state.phase_0_operator_env_detect.operator_name}"
      level: "${state.phase_0_operator_env_detect.level}"
      definition_path: "${state.phase_0_operator_env_detect.definition_path}"
      workload_path: "${state.phase_0_operator_env_detect.workload_path}"
      operator_constraints: "${context.OPERATOR_CONSTRAINTS}"
      runtime_report: "${state.phase_1_operator_runtime_detect}"
      runtime_configuration: "${state.phase_1_5_operator_runtime_configure}"
    transitions:
      on_success: phase_3_custom_op_prepare
      on_failure: failed

  - id: phase_3_custom_op_prepare
    name: operator_generation_evaluation_and_repair
    type: loop
    sub_workflow: operator_repair_loop
    input_mapping:
      OPERATOR_TASK_DIR: "${state.phase_0_operator_env_detect.operator_task_dir}"
      OPERATOR_NAME: "${state.phase_0_operator_env_detect.operator_name}"
      OPERATOR_DEFINITION_PATH: "${state.phase_0_operator_env_detect.definition_path}"
      OPERATOR_WORKLOAD_PATH: "${state.phase_0_operator_env_detect.workload_path}"
      KERNELBENCH_ROOT: "${context.KERNELBENCH_ROOT}"
      OPERATOR_SOLUTION_PATH: "${context.OPERATOR_SOLUTION_PATH}"
      OPERATOR_OUTPUT_DIR: "${context.OPERATOR_OUTPUT_DIR}"
      TARGET_SOC: "${context.TARGET_SOC}"
      OPERATOR_CONSTRAINTS: "${context.OPERATOR_CONSTRAINTS}"
      OPERATOR_LEVEL: "${context.OPERATOR_LEVEL}"
      SOLUTION_TYPE: "${context.SOLUTION_TYPE}"
      OPERATOR_ANALYSIS: "${state.phase_2_operator_analysis}"
      OPERATOR_RUNTIME_REPORT: "${state.phase_1_operator_runtime_detect}"
      OPERATOR_RUNTIME_CONFIGURATION: "${state.phase_1_5_operator_runtime_configure}"
      OPERATOR_RUNTIME_ENV_FILE: "${state.phase_1_5_operator_runtime_configure.environment_file}"
    transitions:
      on_success: phase_4_operator_report
      on_failure: failed

  - id: phase_4_operator_report
    name: operator_report
    type: llm
    agent: main_engineer
    prompt_template: "phase_4_operator_report"
    validator: operator_report
    input_mapping:
      operator_name: "${state.phase_0_operator_env_detect.operator_name}"
      operator_output_dir: "${context.OPERATOR_OUTPUT_DIR}"
    transitions:
      on_success: complete
      on_failure: complete

sub_workflows:
  operator_repair_loop:
    id: operator_repair_loop
    type: loop
    max_iterations: 8  # 与 globals 保持一致
    stagnation_threshold: 3
    review_gate_enabled: false
    stop_conditions:
      - condition: "$.operator_passed == true"
        status: success
      - condition: "$.stagnation_count >= 3"
        status: stagnation
    phases:
      - id: initialize_operator_artifact
        type: builtin
        operation: "operator_artifact_initialize"
        on_failure: continue

      - id: pack_existing_operator
        type: builtin
        operation: "operator_artifact_pack"
        output_as: "operator_artifact_pack"
        on_failure: continue

      - id: validate_operator_artifact
        type: builtin
        operation: "operator_artifact_validate"
        output_as: "operator_artifact_state"
        on_failure: continue

      - id: prepare_operator
        type: llm
        agent: main_engineer
        prompt_template: "phase_3_custom_op_prepare"
        timeout: 2400  # qwen3.8-27b 慢，从 1200 提到 2400（40 分钟）
        condition: >-
          ${loop_state.operator_artifact_state.rebuild_required} == true
        output_as: "operator_preparation"
        input_mapping:
          operator_task_dir: "${loop_vars.OPERATOR_TASK_DIR}"
          operator_name: "${loop_vars.OPERATOR_NAME}"
          definition_path: "${loop_vars.OPERATOR_DEFINITION_PATH}"
          workload_path: "${loop_vars.OPERATOR_WORKLOAD_PATH}"
          target_soc: "${loop_vars.TARGET_SOC}"
          operator_constraints: "${loop_vars.OPERATOR_CONSTRAINTS}"
          previous_outputs: "${loop_vars.OPERATOR_ANALYSIS}"
          runtime_report: "${loop_vars.OPERATOR_RUNTIME_REPORT}"
          runtime_configuration: "${loop_vars.OPERATOR_RUNTIME_CONFIGURATION}"
        runtime_skills:
          include:
            - cuda-custom-op-to-npu-custom-op
          inject_full: false
          missing: error
        on_failure: continue

      - id: pack_prepared_operator
        type: builtin
        operation: "operator_artifact_pack"
        params:
          producer: prepare_operator
        condition: "${loop_state.operator_artifact_state.rebuild_required} == true"
        output_as: "operator_artifact_pack"
        on_failure: continue

      - id: refresh_operator_artifact
        type: builtin
        operation: "operator_artifact_validate"
        output_as: "operator_artifact_state"
        on_failure: continue

      - id: evaluate_operator
        type: builtin
        operation: "operator_kernelbench_eval"
        params:
          timeout: 1800
        on_failure: continue

      - id: classify_operator_evaluation
        type: builtin
        operation: "operator_evaluation_classify"
        output_as: "evaluation_classification"
        on_failure: continue

      - id: analyze_operator_failure
        type: llm
        agent: error_analyzer
        prompt_template: "phase_operator_error_analysis"
        condition: "${loop_state.operator_passed} != true"
        output_as: "error_analysis"
        input_mapping:
          operator_constraints: "${loop_vars.OPERATOR_CONSTRAINTS}"
          runtime_report: "${loop_vars.OPERATOR_RUNTIME_REPORT}"
          runtime_configuration: "${loop_vars.OPERATOR_RUNTIME_CONFIGURATION}"
          evaluation_result: "${loop_state.evaluate_operator}"
          evaluation_classification: "${loop_state.evaluation_classification}"

      - id: fix_operator_environment
        type: llm
        agent: operator_environment_fixer
        prompt_template: "repair_operator_environment"
        condition: >-
          ${loop_state.operator_passed} != true
          and ${loop_state.evaluation_classification.repair_role} == 'operator_environment_fixer'
          or ${loop_state.operator_passed} != true
          and ${loop_state.error_analysis.repair_role} == 'operator_environment_fixer'
        input_mapping:
          runtime_report: "${loop_vars.OPERATOR_RUNTIME_REPORT}"
          runtime_configuration: "${loop_vars.OPERATOR_RUNTIME_CONFIGURATION}"
          error_analysis: "${loop_state.error_analysis}"
          operator_task_dir: "${loop_vars.OPERATOR_TASK_DIR}"
          kernelbench_root: "${loop_vars.KERNELBENCH_ROOT}"
        on_failure: continue

      - id: fix_operator
        type: llm
        agent: operator_fixer
        prompt_template: "repair_operator_fixer_kernelbench_ascendc"
        timeout: 2400  # qwen3.8-27b 慢，从 1200 提到 2400（40 分钟）
        condition: >-
          ${loop_state.operator_passed} != true
          and ${loop_state.evaluation_classification.repair_role} != 'operator_environment_fixer'
          and ${loop_state.error_analysis.repair_role} != 'operator_environment_fixer'
        runtime_skills:
          include:
            - cuda-custom-op-to-npu-custom-op
          inject_full: false
          missing: error
        input_mapping:
          operator_constraints: "${loop_vars.OPERATOR_CONSTRAINTS}"
        on_failure: continue

      - id: pack_repaired_operator
        type: builtin
        operation: "operator_artifact_pack"
        params:
          producer: fix_operator
        condition: >-
          ${loop_state.operator_passed} != true
          and ${loop_state.evaluation_classification.repair_role} != 'operator_environment_fixer'
          and ${loop_state.error_analysis.repair_role} != 'operator_environment_fixer'
        output_as: "operator_artifact_pack"
        on_failure: continue
